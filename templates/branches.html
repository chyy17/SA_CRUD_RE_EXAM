<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Branch Management</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
  <div class="container-fluid">
    <a class="navbar-brand" href="{{ url_for('index') }}">CRUD System</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation"><span class="navbar-toggler-icon"></span></button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav">
        <li class="nav-item"><a class="nav-link active" href="{{ url_for('branches') }}">Branches</a></li>
        <li class="nav-item"><a class="nav-link" href="{{ url_for('categories') }}">Categories</a></li>
        <li class="nav-item"><a class="nav-link" href="{{ url_for('products') }}">Products</a></li>
      </ul>
    </div>
  </div>
</nav>

<div class="container mt-4">
  <h2>Branch Management</h2>
  <form method="POST" action="{{ url_for('add_branch') }}" enctype="multipart/form-data" class="row g-3 align-items-center mb-4">
    <div class="col-md-3"><input type="text" class="form-control" name="name" placeholder="Name" required></div>
    <div class="col-md-3"><input type="email" class="form-control" name="email" placeholder="Email" required></div>
    <div class="col-md-2"><input type="text" class="form-control" name="phone" placeholder="Phone" required></div>
    <div class="col-md-3"><input type="file" class="form-control" name="logo" accept="image/png,image/jpeg,image/gif,image/webp"></div>
    <div class="col-md-1 d-grid"><button type="submit" class="btn btn-primary">Add</button></div>
  </form>

  <div class="table-responsive">
    <table class="table table-bordered table-hover align-middle">
      <thead class="table-primary"><tr><th>ID</th><th>Name</th><th>Email</th><th>Phone</th><th>Logo</th><th>Actions</th></tr></thead>
      <tbody>
      {% for b in branches %}
        <tr>
          <td>{{ b.Id }}</td><td>{{ b.Name }}</td><td>{{ b.Email }}</td><td>{{ b.Phone }}</td>
          <td>{% if b.Logo %}<img src="{{ b.Logo }}" alt="Logo" width="50" height="50" class="object-fit-cover">{% else %}-{% endif %}</td>
          <td class="text-nowrap">
            <form method="POST" action="{{ url_for('delete_branch', id=b.Id) }}" class="d-inline" onsubmit="return confirm('Are you sure you want to delete this branch?');"><button class="btn btn-sm btn-danger">Delete</button></form>
            <button type="button" class="btn btn-sm btn-warning" data-bs-toggle="modal" data-bs-target="#editModal{{ b.Id }}">Edit</button>
            <div class="modal fade" id="editModal{{ b.Id }}" tabindex="-1" aria-hidden="true">
              <div class="modal-dialog"><form method="POST" action="{{ url_for('update_branch', id=b.Id) }}" enctype="multipart/form-data">
                <div class="modal-content"><div class="modal-header"><h5 class="modal-title">Edit Branch</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
                <div class="modal-body">
                  <div class="mb-3"><label class="form-label">Name</label><input type="text" class="form-control" name="name" value="{{ b.Name }}" required></div>
                  <div class="mb-3"><label class="form-label">Email</label><input type="email" class="form-control" name="email" value="{{ b.Email }}" required></div>
                  <div class="mb-3"><label class="form-label">Phone</label><input type="text" class="form-control" name="phone" value="{{ b.Phone }}" required></div>
                  <div class="mb-3"><label class="form-label">Replace Logo</label><input type="file" class="form-control" name="logo" accept="image/png,image/jpeg,image/gif,image/webp"></div>
                </div>
                <div class="modal-footer"><button type="submit" class="btn btn-primary">Save Changes</button><button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button></div>
                </div>
              </form></div>
            </div>
          </td>
        </tr>
      {% else %}<tr><td colspan="6" class="text-center text-muted">No branches yet.</td></tr>{% endfor %}
      </tbody>
    </table>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
