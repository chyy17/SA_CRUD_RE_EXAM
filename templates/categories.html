<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Category Management</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary"><div class="container-fluid"><a class="navbar-brand" href="{{ url_for('index') }}">CRUD System</a><button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"><span class="navbar-toggler-icon"></span></button><div class="collapse navbar-collapse" id="navbarNav"><ul class="navbar-nav"><li class="nav-item"><a class="nav-link" href="{{ url_for('branches') }}">Branches</a></li><li class="nav-item"><a class="nav-link active" href="{{ url_for('categories') }}">Categories</a></li><li class="nav-item"><a class="nav-link" href="{{ url_for('products') }}">Products</a></li></ul></div></div></nav>
<div class="container mt-4">
  <h2>Category Management</h2>
  <form method="POST" action="{{ url_for('add_category') }}" class="row g-3 align-items-center mb-4"><div class="col-md-10"><input type="text" class="form-control" name="name" placeholder="Category Name" required></div><div class="col-md-2 d-grid"><button class="btn btn-primary">Add Category</button></div></form>
  <div class="table-responsive"><table class="table table-bordered table-hover"><thead class="table-primary"><tr><th>ID</th><th>Name</th><th>Actions</th></tr></thead><tbody>
  {% for c in categories %}<tr><td>{{ c.Id }}</td><td>{{ c.Name }}</td><td class="text-nowrap"><form method="POST" action="{{ url_for('delete_category', id=c.Id) }}" class="d-inline" onsubmit="return confirm('Are you sure you want to delete this category?');"><button class="btn btn-sm btn-danger">Delete</button></form><button type="button" class="btn btn-sm btn-warning" data-bs-toggle="modal" data-bs-target="#editModal{{ c.Id }}">Edit</button><div class="modal fade" id="editModal{{ c.Id }}" tabindex="-1" aria-hidden="true"><div class="modal-dialog"><form method="POST" action="{{ url_for('update_category', id=c.Id) }}"><div class="modal-content"><div class="modal-header"><h5 class="modal-title">Edit Category</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body"><input type="text" class="form-control" name="name" value="{{ c.Name }}" required></div><div class="modal-footer"><button type="submit" class="btn btn-primary">Save Changes</button><button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button></div></div></form></div></div></td></tr>
  {% else %}<tr><td colspan="3" class="text-center text-muted">No categories yet.</td></tr>{% endfor %}</tbody></table></div>
</div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script></body></html>
